[package]
name = "pulseflow-governor"
version = "0.6.0"
edition = "2021"
rust-version = "1.75"
authors = ["James Paul Jackson"]
description = "A local pulse-feedback workload governor, observation recorder, replay lab, and agent resource-homeostasis interface."
license = "MIT"
repository = ""

[dependencies]
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
sysinfo = "=0.29.11"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
